<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Image Compressor</title>
</head>
<body>
  <h1>Compressing Images...</h1>
  <div id="status">Starting...</div>
  <textarea id="result" style="width: 100%; height: 400px; display: none;"></textarea>

  <script>
    const imagesToCompress = [
      { name: 'instructor.png', path: 'images/instructor.png' },
      { name: 'image1.png', path: 'images/image1.png' },
      { name: 'image2.png', path: 'images/image2.png' },
      { name: 'image3.png', path: 'images/image3.png' },
      { name: 'image4.png', path: 'images/image4.png' },
      { name: 'image5.png', path: 'images/image5.png' }
    ];

    const results = {};

    function compressImage(imgInfo) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          // 최대 너비를 800px로 제한
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // jpeg 0.75 품질로 압축 (용량을 크게 줄이면서 화질 저하 최소화)
          const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
          results[imgInfo.name] = dataUrl;
          resolve();
        };
        img.onerror = function() {
          reject(new Error('Failed to load image: ' + imgInfo.path));
        };
        img.src = imgInfo.path;
      });
    }

    async function run() {
      const statusDiv = document.getElementById('status');
      try {
        for (const imgInfo of imagesToCompress) {
          statusDiv.innerText = 'Compressing ' + imgInfo.name + '...';
          await compressImage(imgInfo);
        }
        statusDiv.innerText = 'Compression Complete!';
        const textarea = document.getElementById('result');
        textarea.value = JSON.stringify(results);
        textarea.style.display = 'block';
      } catch (err) {
        statusDiv.innerText = 'Error: ' + err.message;
        console.error(err);
      }
    }

    run();
  </script>
</body>
</html>
